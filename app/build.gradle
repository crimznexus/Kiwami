plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlinx-serialization'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.0'
}

def gitCommitHash = providers.exec {
    commandLine("git", "rev-parse", "--verify", "--short", "HEAD")
}.standardOutput.asText.get().trim()

// These have to be applied at the project level: `apply plugin` inside a
// productFlavor block leaks to every flavor, which forced the Firebase-free
// fdroid build to demand a google-services.json. Only apply them when a google
// variant is actually being built, so the fdroid build stays self-contained and
// a missing google-services.json still fails loudly for google builds.
def buildingGoogleFlavor = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("google")
}
if (buildingGoogleFlavor || file("google-services.json").exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "app.kiwami"
        // 24+, not 23: below 24, D8 desugars default interface methods by stripping them from
        // the interface, so extensions (which link against the host's kotlinx.serialization,
        // OkHttp, etc. at runtime) hit AbstractMethodError, e.g. MangaDex on
        // GeneratedSerializer.typeParametersSerializers().
        minSdk 24
        targetSdk 35
        versionName "1.0.3"
        versionCode 100000011
        signingConfig signingConfigs.debug
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Page enhancer's GPU path (src/main/cpp, ncnn + Vulkan). Built for the ABIs that ship;
        // 32-bit x86 is dropped from the APKs anyway (see packaging).
        externalNativeBuild {
            cmake {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    ndkVersion "27.0.12077973"
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // Release signing reads a properties file kept outside the repo (storeFile, storePassword,
    // keyAlias, keyPassword). Point KIWAMI_SIGNING at it, or keep it at the default path.
    // Without it, release builds fall back to the debug key.
    def signingProps = new Properties()
    def signingFile = file(System.getenv("KIWAMI_SIGNING") ?:
            "${System.getProperty("user.home")}/.android-keys/kiwami-release.properties")
    if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
    signingConfigs {
        if (signingProps.storeFile) {
            release {
                storeFile file(signingProps.storeFile)
                storePassword signingProps.storePassword
                keyAlias signingProps.keyAlias
                keyPassword signingProps.keyPassword
            }
        }
    }

    flavorDimensions += "store"
    productFlavors {
        fdroid {
            // F-Droid specific configuration
            dimension "store"
            versionNameSuffix "-fdroid"
        }
        google {
            // Google Play specific configuration
            dimension "store"
            isDefault true
        }
    }

    buildTypes {
        alpha {
            // Development build: its own package (and debug key) so it installs next to the
            // release-signed app instead of conflicting with it.
            applicationIdSuffix ".alpha"
            versionNameSuffix "-alpha"
            manifestPlaceholders.icon_placeholder = "@mipmap/ic_launcher"
            manifestPlaceholders.icon_placeholder_round = "@mipmap/ic_launcher_round"
            debuggable System.getenv("CI") == null
            isDefault true
        }
        debug {
            // applicationIdSuffix ".beta"
            versionNameSuffix "-beta01"
            manifestPlaceholders.icon_placeholder = "@mipmap/ic_launcher"
            manifestPlaceholders.icon_placeholder_round = "@mipmap/ic_launcher_round"
            debuggable false
        }
        release {
            manifestPlaceholders.icon_placeholder = "@mipmap/ic_launcher"
            manifestPlaceholders.icon_placeholder_round = "@mipmap/ic_launcher_round"
            debuggable false
            signingConfig signingConfigs.findByName("release") ?: signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-gson.pro', 'proguard-rules.pro'
        }
    }
    packaging {
        jniLibs {
            // Compress native libraries (extracted on install) rather than storing them raw:
            // ONNX Runtime alone is 32 MB per ABI and compresses to about a third.
            useLegacyPackaging = true
            // 32-bit x86 only matters for old emulators; x86_64 still covers current ones.
            excludes += ["lib/x86/**"]
        }
        resources {
            // OkHttp 5.3's modules and jspecify each ship this OSGi metadata file, which is
            // meaningless on Android; without this the java-resource merge fails.
            pickFirsts += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs = ["-Xcontext-receivers", "-Xmulti-platform"]
    }
    namespace 'ani.dantotsu'
    testBuildType "alpha"
    
    // ABI splits for generating separate APKs per architecture
    splits {
        abi {
            enable true
            reset()
            // x86_64 is here for emulators: native code (src/main/cpp) is only built for the
            // ABIs listed, so without it the universal APK would lack the enhancer's GPU library.
            // Its split APK is not published.
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk true  // Also generate a universal APK
        }
    }
    
    // Custom APK naming
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi == null) abi = "universal"
            outputFileName = "Kiwami-${abi}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {

//  FireBase
    googleImplementation platform('com.google.firebase:firebase-bom:33.0.0')
    googleImplementation 'com.google.firebase:firebase-analytics-ktx:22.0.0'
    googleImplementation 'com.google.firebase:firebase-crashlytics-ktx:19.0.0'
//  Core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.Blatzar:NiceHttp:0.4.4'
    // Extensions use the host's kotlinx.serialization. Lib 1.6 ones are compiled against a
    // runtime where GeneratedSerializer.typeParametersSerializers() has a default body (1.6.3
    // still has it abstract: AbstractMethodError). 1.9.0 is the newest for Kotlin 2.2.
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.9.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation "com.anggrayudi:storage:1.5.5"
    implementation "androidx.biometric:biometric:1.1.0"


//  Glide
    ext.glide_version = '4.16.0'
    api "com.github.bumptech.glide:glide:$glide_version"
    implementation "com.github.bumptech.glide:glide:$glide_version"
    ksp "com.github.bumptech.glide:ksp:$glide_version"
    implementation "com.github.bumptech.glide:okhttp3-integration:$glide_version"
    implementation 'jp.wasabeef:glide-transformations:4.3.0'

//  Exoplayer
    ext.exo_version = '1.9.4'
    implementation "androidx.media3:media3-exoplayer:$exo_version"
    implementation "androidx.media3:media3-ui:$exo_version"
    implementation "androidx.media3:media3-exoplayer-hls:$exo_version"
    implementation "androidx.media3:media3-exoplayer-dash:$exo_version"
    implementation "androidx.media3:media3-datasource-okhttp:$exo_version"
    implementation "androidx.media3:media3-session:$exo_version"
//  Media3 Casting
    implementation "androidx.media3:media3-cast:$exo_version"
    implementation "androidx.mediarouter:mediarouter:1.7.0"
// Media3 extension
    implementation "com.github.anilbeesetti.nextlib:nextlib-media3ext:0.8.3"

//  Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation "io.coil-kt:coil-compose:2.6.0"

//  Android Liquid Glass (Backdrop)
    implementation 'io.github.kyant0:backdrop:1.0.0-rc02'
    implementation 'io.github.kyant0:capsule:2.1.2'

//  UI
    implementation 'com.github.Dimezis:BlurView:version-2.0.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.flaviofaria:kenburnsview:1.0.7'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    implementation 'com.alexvasilkov:gesture-views:2.8.3'
    implementation 'com.github.VipulOG:ebook-reader:0.1.6'
    implementation 'androidx.paging:paging-runtime-ktx:3.2.1'
    implementation 'com.github.eltos:simpledialogfragments:v3.7'
    implementation 'com.github.AAChartModel:AAChartCore-Kotlin:7.2.3'

//  Markwon
    ext.markwon_version = '4.6.2'
    implementation "io.noties.markwon:core:$markwon_version"
    implementation "io.noties.markwon:editor:$markwon_version"
    implementation "io.noties.markwon:ext-strikethrough:$markwon_version"
    implementation "io.noties.markwon:ext-tables:$markwon_version"
    implementation "io.noties.markwon:ext-tasklist:$markwon_version"
    implementation "io.noties.markwon:html:$markwon_version"
    implementation "io.noties.markwon:image-glide:$markwon_version"

//  Groupie
    ext.groupie_version = '2.10.1'
    implementation "com.github.lisawray.groupie:groupie:$groupie_version"
    implementation "com.github.lisawray.groupie:groupie-viewbinding:$groupie_version"

//  String Matching
    implementation 'me.xdrop:fuzzywuzzy:1.4.0'

//  Aniyomi
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'io.reactivex:rxandroid:1.2.1'
    implementation 'ru.beryukhov:flowreactivenetwork:1.0.4'
    implementation 'ca.gosyer:voyager-navigator:1.0.0-rc07'
    implementation 'com.squareup.logcat:logcat:0.1'
    implementation 'uy.kohesive.injekt:injekt-core:1.16.+'
    // Extensions built against extensions-lib 1.6 use the host's OkHttp directly and call
    // classes that postdate 5.0.0-alpha.14 (okhttp3.CompressionInterceptor), failing every
    // request with NoClassDefFoundError. 5.3.2 is the newest release that has it and still
    // builds against compileSdk 35: 5.4.0+ require compileSdk 36 or later, which this
    // Android Gradle plugin does not support. Keep all okhttp3 artifacts on one version.
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:5.3.2'
    implementation 'com.squareup.okio:okio:3.8.0'
    implementation 'com.squareup.okhttp3:okhttp-brotli:5.3.2'
    // Lib 1.6 extensions build a CompressionInterceptor with okhttp3.zstd.Zstd, which the host
    // must provide (Mihon ships it too); without it searches fail with NoClassDefFoundError.
    implementation 'com.squareup.okhttp3:okhttp-zstd:5.3.2'
    implementation 'org.jsoup:jsoup:1.16.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.9.0'
    implementation 'com.jakewharton.rxrelay:rxrelay:1.2.0'
    implementation 'com.github.tachiyomiorg:unifile:17bec43'
    implementation 'com.github.gpanther:java-nat-sort:natural-comparator-1.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'app.cash.quickjs:quickjs-android:0.9.2'

//  Page enhancer: runs the bundled Real-ESRGAN model (assets/enhance) on downloaded chapters
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.29.0'

//  Instrumented tests (./gradlew connectedFdroidAlphaAndroidTest)
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'

}
